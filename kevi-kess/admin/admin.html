<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kevi Kess Admin</title>
<style>
  :root{--navy:#0f2747;--gold:#c9a227;--bg:#f4f6fa;--line:#dde3ec}
  *{box-sizing:border-box} body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:#1b2433}
  header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  header h1{margin:0;font-size:18px} header span{color:var(--gold)}
  header button{color:var(--navy);font-weight:700}
  main{max-width:1200px;margin:20px auto;padding:0 16px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px}
  .stat b{display:block;font-size:24px;color:var(--navy)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tab,button,select,input{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .tab{cursor:pointer} .tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .grow{flex:1;min-width:160px}
  .wrap{background:#fff;border:1px solid var(--line);border-radius:8px;overflow-x:auto}
  table{border-collapse:collapse;width:100%} th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:#f0f3f8;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  td.long{max-width:320px;white-space:pre-wrap;word-break:break-word}
  .del{color:#b00020;cursor:pointer;border-color:#e8b4bc}
  .empty{padding:30px;text-align:center;color:#6b7686}
  .pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:10px}
</style></head><body>
<header><h1>KEVI KESS <span>Admin</span></h1><div><small>Live database dashboard</small> <button id="refresh" type="button">Refresh</button> <button id="logout" type="button">Sign out</button></div></header>
<main>
  <div class="stats" id="stats"></div>
  <div id="error" class="empty" hidden></div>
  <div class="bar">
    <button class="tab on" data-kind="candidates">Candidate enquiries</button>
    <button class="tab" data-kind="employers">Employer requests</button>
    <button class="tab" data-kind="accounts">Accounts</button>
    <button class="tab" data-kind="jobs">Jobs</button>
    <button class="tab" data-kind="applications">Applications</button>
    <input class="grow" id="q" placeholder="Search…">
    <select id="statusFilter"><option value="">All statuses</option></select>
  </div>
  <div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty" hidden>No submissions found.</div></div>
  <div class="pager"><button id="prev">‹ Prev</button><span id="pageinfo"></span><button id="next">Next ›</button></div>
</main>
<script>
const COLS = {
  candidates: [['name','Name'],['phone','Phone'],['role','Sector'],['experience','Experience / skills']],
  employers:  [['company','Company / contact'],['phone','Phone'],['role','Worker type'],['count','Count'],['details','Requirements']],
  accounts: [['role','Account type'],['email','Email'],['fullName','Candidate name'],['companyName','Company'],['phone','Phone']],
  jobs: [['title','Job title'],['employer.companyName','Employer'],['location','Location'],['sector','Sector'],['employmentType','Type']],
  applications: [['job.title','Job'],['candidate.fullName','Candidate'],['candidate.email','Candidate email'],['employer.companyName','Employer']]
};
let kind = 'candidates', page = 1, pages = 1, statuses = [];
const $ = (id) => document.getElementById(id);

async function api(url, opts) {
  const res = await fetch(url, opts);
  if (res.status === 401) {
    location.replace('/admin/login');
    throw new Error('Admin session expired. Redirecting to sign in.');
  }
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || (data.errors || []).join(' ') || res.statusText);
  }
  return res.json();
}
const jsonOpts = (method, body) => ({ method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach((k) => n.append(k));
  return n;
}

async function loadStats() {
  const s = await api('/api/admin/stats');
  $('stats').replaceChildren(
    ...[['Candidate enquiries', s.candidates], ['New candidate enquiries', s.newCandidates], ['Employer requests', s.employers], ['New employer requests', s.newEmployers], ['Candidate accounts', s.candidateAccounts], ['Employer accounts', s.employerAccounts], ['All jobs', s.jobs], ['Open jobs', s.openJobs], ['Applications', s.applications]]
      .map(([l, v]) => el('div', { className: 'stat' }, el('b', { textContent: v }), l))
  );
}

async function load() {
  const params = new URLSearchParams({ page, limit: 25 });
  if ($('q').value.trim()) params.set('q', $('q').value.trim());
  if ($('statusFilter').value) params.set('status', $('statusFilter').value);
  if (kind === 'accounts') params.set('role', $('statusFilter').value);
  const data = await api(`/api/admin/${kind}?${params}`);
  pages = data.pages || 1;
  const nextStatuses = data.statuses || [];

  if (statuses.join() !== nextStatuses.join() || kind === 'accounts') {
    statuses = nextStatuses;
    const cur = $('statusFilter').value;
    $('statusFilter').replaceChildren(el('option', { value: '', textContent: 'All statuses' }),
      ...statuses.map((s) => el('option', { value: s, textContent: s })));
    if (kind === 'accounts') {
      $('statusFilter').replaceChildren(el('option', { value: '', textContent: 'All account types' }),
        el('option', { value: 'candidate', textContent: 'Candidate' }),
        el('option', { value: 'employer', textContent: 'Employer' }));
    }
    $('statusFilter').value = cur;
  }

  const cols = COLS[kind];
  const hasStatus = nextStatuses.length > 0;
  const hasNotes = ['candidates', 'employers'].includes(kind);
  $('thead').replaceChildren(el('tr', {},
    el('th', { textContent: kind === 'accounts' ? 'Registered' : 'Created' }),
    ...cols.map(([, l]) => el('th', { textContent: l })),
    ...(hasStatus ? [el('th', { textContent: 'Status' })] : []),
    ...(hasNotes ? [el('th', { textContent: 'Notes' })] : []),
    ...(hasNotes ? [el('th')] : [])));

  $('tbody').replaceChildren(...data.items.map((it) => {
    const read = (item, path) => path.split('.').reduce((value, part) => value && value[part], item);
    const cells = cols.map(([key]) => {
      const value = read(it, key);
      return el('td', { className: 'long', textContent: value == null ? '' : value });
    });
    const created = new Date(it.createdAt).toLocaleString();
    const row = [el('td', { textContent: created }), ...cells];
    if (hasStatus) {
      const sel = el('select', {}, ...nextStatuses.map((s) => el('option', { value: s, textContent: s, selected: s === it.status })));
      sel.onchange = async () => { try { await api(`/api/admin/${kind}/${it._id}`, jsonOpts('PATCH', { status: sel.value })); await Promise.all([load(), loadStats()]); } catch (error) { showError(error); } };
      row.push(el('td', {}, sel));
    }
    if (hasNotes) {
      const notes = el('input', { value: it.notes || '', placeholder: 'Add note' });
      notes.onchange = async () => { try { await api(`/api/admin/${kind}/${it._id}`, jsonOpts('PATCH', { notes: notes.value })); } catch (error) { showError(error); } };
      const del = el('button', { className: 'del', textContent: 'Delete' });
      del.onclick = async () => {
        if (!confirm('Delete this submission permanently?')) return;
        try { await api(`/api/admin/${kind}/${it._id}`, { method: 'DELETE' }); await Promise.all([load(), loadStats()]); }
        catch (error) { showError(error); }
      };
      row.push(el('td', {}, notes), el('td', {}, del));
    }
    return el('tr', {}, ...row);
  }));

  $('empty').hidden = data.items.length > 0;
  $('pageinfo').textContent = `Page ${data.page} of ${pages} · ${data.total} total`;
  $('prev').disabled = page <= 1; $('next').disabled = page >= pages;
  if (kind === 'accounts') $('statusFilter').options[0].textContent = 'All account types';
  if (kind === 'jobs') $('statusFilter').options[0].textContent = 'All job statuses';
  if (kind === 'applications') $('statusFilter').options[0].textContent = 'All application statuses';
  if (kind === 'candidates' || kind === 'employers') $('statusFilter').options[0].textContent = 'All statuses';
}

document.querySelectorAll('.tab').forEach((t) => t.onclick = () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
  kind = t.dataset.kind; page = 1; pages = 1; statuses = []; $('statusFilter').value = ''; load().catch(showError);
});
$('statusFilter').onchange = () => { page = 1; load().catch(showError); };
let timer; $('q').oninput = () => { clearTimeout(timer); timer = setTimeout(() => { page = 1; load().catch(showError); }, 300); };
$('prev').onclick = () => { page--; load().catch(showError); };
$('next').onclick = () => { page++; load().catch(showError); };
function showError(error) { $('error').hidden = false; $('error').textContent = error.message; }
async function refresh() { $('error').hidden = true; await Promise.all([loadStats(), load()]); }
$('refresh').onclick = () => refresh().catch(showError);
$('logout').onclick = async () => {
  try { await api('/api/admin/logout', jsonOpts('POST', {})); location.replace('/admin/login'); }
  catch (error) { showError(error); }
};
refresh().catch(showError);
setInterval(() => refresh().catch(showError), 30000);
</script></body></html>
